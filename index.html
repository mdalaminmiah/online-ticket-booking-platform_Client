<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="TicketBari — Book bus, train, launch & flight tickets across Bangladesh easily, securely and instantly."
        />
        <meta name="theme-color" content="#4f46e5" />
        <title>TicketBari — Book Bus, Train, Launch & Flight Tickets</title>

        <!-- The design tokens in index.css ask for Inter / Plus Jakarta Sans;
             without these links they silently fell back to Segoe UI. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
            rel="stylesheet"
        />

        <!-- Ticket imagery is served from the Unsplash CDN; warming the
             connection shaves a round-trip off the hero's first paint. -->
        <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
        <script>
            (function () {
                try {
                    var t = localStorage.getItem('ticketbari-theme');
                    var dark = t
                        ? t === 'dark'
                        : window.matchMedia('(prefers-color-scheme: dark)')
                              .matches;
                    if (dark) document.documentElement.classList.add('dark');
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
